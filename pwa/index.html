<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#155eef">
    <meta name="description" content="Captura de campo offline do ScanEntrega">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <title>ScanEntrega</title>
    <script src="./vendor/dexie.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>ScanEntrega</h1>
        <span id="network-status" class="network-status" role="status">Verificando conexão…</span>
      </header>

      <section class="camera-panel" aria-label="Captura de fotos">
        <video id="camera-video" autoplay playsinline muted aria-label="Pré-visualização da câmera"></video>
        <div id="camera-message" class="camera-message" role="status">
          Preparando câmera…
        </div>
        <canvas id="capture-canvas" hidden></canvas>
      </section>

      <section class="controls" aria-label="Ações">
        <button id="capture-button" class="button button-primary" type="button" disabled>
          Tirar Foto
        </button>
        <button id="send-button" class="button button-secondary" type="button" disabled>
          Enviar (0)
        </button>
        <button id="clear-button" class="button button-quiet" type="button" disabled>
          Limpar lote
        </button>
        <button id="update-button" class="button button-update" type="button" hidden>
          Atualizar aplicativo
        </button>
      </section>

      <p id="secure-context-warning" class="notice notice-warning" hidden>
        A câmera e o modo offline precisam de HTTPS. Em desenvolvimento, use localhost.
      </p>
      <p id="queue-warning" class="notice notice-warning" hidden></p>

      <section class="queue-section" aria-labelledby="queue-title">
        <div class="section-heading">
          <h2 id="queue-title">Fotos do lote</h2>
          <span id="queue-count" class="queue-count">0 fotos</span>
        </div>
        <div id="photo-list" class="photo-list" aria-live="polite"></div>
        <p id="empty-queue" class="empty-queue">As fotos capturadas aparecerão aqui.</p>
      </section>

      <p id="app-status" class="app-status" role="status" aria-live="polite">
        Iniciando ScanEntrega…
      </p>
    </main>
  </body>
</html>
